<html>
    <head>
        <title>Styling for List, Table and URL</title>
    </head>

    <style>
        h1{
            text-align: center;
            text-decoration: underline;
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
            font-weight: 200px;
        }

        a{
            color: blue;
            font-size: x-large;
        }

        a:hover{
            color: crimson;
        }

        a:active{
            color: darkgoldenrod;
        }

        a:visited{
            color: bisque;
        }

        ul{
            font-family: 'Times New Roman', Times, serif;
            font-size: 30px;
            font-weight: 20px;
            list-style-type: circle;
            line-height: 60px;
        }

        ol{
            list-style: decimal-leading-zero;
            font-family: 'Times New Roman', Times, serif;
            font-size: 30px;
            font-weight: 20px;
        }

        table, th, td{
            border: solid;
            border-color: black;
            border-radius: 5px;
            border-width: 10px;
        }

     

    </style>
    
    <body>

        <h1>How to Enhance the list, table and Url using CSS</h1>

        <a href="https://www.wikipedia.org/">Link</a>

        <ul>
            <li>Improve yourself</li>
            <li>Stay Consistent</li>
            <li>Dont waste youe time</li>
        </ul>

        <ol>
            <li>Wake up early</li>
            <li>Make a Plan</li>
            <li>Follow the Plan</li>
        </ol>

        <table>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>

            <tr>
                <td>Vicky</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Logan</td>
                <td>25</td>
            </tr>

            <tr>
                <td>Tony</td>
                <td>23</td>
            </tr>
        </table>

    </body>
</html>
