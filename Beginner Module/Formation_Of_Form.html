<html>

<head>
    <title>Form Formating</title>
</head>

<body>

    <h1 style="text-align: center;">Enter Your Credential Details</h1>

    <form action="\">

    <label for="Fname">First Name : </label>    
    <input type="text" name="Fname" placeholder="Enter Your First Name">

    <label for="Lname">Last Name : </label>    
    <input type="text" name="Lname" placeholder="Enter Your Last Name">
    <br><br>

    <label for="Pass">Password : </label>    
    <input type="text" name="Password" placeholder="Enter Your Password" required>
    <br><br>   
    
    <p>Gender : </p>
    <label for="Gender">Male</label>
    <input type="radio" name="Gender" value="Male">

    <label for="Gender">Female</label>
    <input type="radio" name="Gender" value="Female">
    <br><br>
     
    <p>Select your Skills : </p>
    <label for="Skill">Java</label>
    <input type="checkbox" name="Skill1" value="Java">

    <label for="Skill">Python</label>
    <input type="checkbox" name="Skill2" value="python">

    <label for="Skill">C</label>
    <input type="checkbox" name="Skill3" value="C">
    <br><br>

    <br>
    <label for="Dept">Department : </label>
    <select name="Dept">
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="AI">AI</option>
    </select>
    <br><br>

    <br>
    <label for="Address">Address :</label>
    <textarea value="Address" rows="2" cols="30"></textarea>
    <br><br> 

    <br>
    <label for="Submit">Submit</label>
    <input type="submit" value="submit">

    </form>


</body>
    
</html>
